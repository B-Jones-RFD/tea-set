name: Publish

on:
  push:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Approval gate. Create an environment named `npm` in the repo settings (with
    # required reviewers) and enter the same name when registering this workflow
    # as a trusted publisher on npmjs.com.
    environment: npm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Installs pnpm (version from package.json devEngines) and Node 24, and caches the pnpm store.
      # pnpm 11 publishes natively (no npm CLI) and performs the OIDC exchange for
      # npm Trusted Publishing itself, so no NPM_TOKEN is configured.
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Display tool versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1.9.0
        with:
          publish: pnpm run release
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
